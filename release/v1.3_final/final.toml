# Conservative V1.3 fine-tuning from round1.
# Round2 over-weighted corrections and regressed OPEN/MAX_TICKS; this run keeps
# a stronger old-demonstration replay and removes phase amplification.
data = "data/v1.3_state4_round3_targeted_replay"
init_checkpoint = "checkpoints/v1.3_base.pt"
output_checkpoint = "checkpoints/v1.3_final.pt"
epochs = 40
batch_ticks = 8
learning_rate = 0.00001
min_epochs = 8
patience = 8
min_pair_ratio = 0.95
correction_data = true
balanced_mixture = true
samples_per_bucket = 32
old_replay_multiplier = 2
correction_multiplier = 1
open_correction_multiplier = 1
close_correction_multiplier = 1
move_to_zone_correction_multiplier = 1
yellow_combo_multiplier = 1
evaluation_standard = "official"
evaluation_scene_seed = 20261105
evaluation_scenes = 200

