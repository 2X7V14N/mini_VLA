# V1.3 round2 targeted fine-tuning plan.
# This file records the exact command; the training script receives CLI args.
data = "data/v1.3_state4_round3_targeted_replay"
init_checkpoint = "checkpoints/v1.3_base.pt"
output_checkpoint = "checkpoints/v1.3_ft.pt"

epochs = 60
batch_ticks = 8
learning_rate = 0.00002
min_epochs = 8
patience = 10
min_pair_ratio = 0.95

correction_data = true
balanced_mixture = true
samples_per_bucket = 32
old_replay_multiplier = 1
correction_multiplier = 3
open_correction_multiplier = 2
close_correction_multiplier = 2
move_to_zone_correction_multiplier = 3
yellow_combo_multiplier = 1

focus = ["MOVE_TO_ZONE", "CLOSE", "OPEN", "OBJECT_SLIPPED", "MAX_TICKS"]
evaluation_standard = "official"
evaluation_scene_seed = 20261105
evaluation_scenes = 200

# Planned command:
